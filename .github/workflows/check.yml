name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fpl-check
  cancel-in-progress: true

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    # the ILP invariant suite takes ~21 min locally and a runner is slower
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: golden files + invariant tests
        # no -x: these are solver tests, and one slow solve used to abort every
        # test after it, hiding real failures behind a timing flake
        run: |
          python tools/selfcheck.py
          pytest tests/ -q