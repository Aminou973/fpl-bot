name: submit

# Applies the plan: logs in to FPL and writes the planned lineup for both
# teams shortly before each deadline. The job itself decides whether the
# deadline is close enough (36h window) and refuses stale plans or squads that
# did not come from the API, so a stray schedule tick can never act on old data.
#
# Requires the FPL_REFRESH_TOKEN repo secret (refresh token of the first
# squad's account, from the one-time device flow in jobs/fpl_login.py); if
# the second squad lives on a different account, also set
# FPL_REFRESH_TOKEN_2. Dispatch runs are dry-runs by default; check "apply"
# only when you mean it.

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
    inputs:
      apply:
        description: "Actually submit (default: dry run)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write

concurrency:
  group: fpl-submit
  cancel-in-progress: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Submit planned lineup
        env:
          FPL_REFRESH_TOKEN: ${{ secrets.FPL_REFRESH_TOKEN }}
          FPL_REFRESH_TOKEN_2: ${{ secrets.FPL_REFRESH_TOKEN_2 }}
          # applied/failed lineup alerts go to the alert tier
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # FPL rotates refresh tokens on every use; the job writes the new
          # one back to the secret with gh. This PAT needs only the
          # "Secrets: read and write" permission on this repository.
          GH_TOKEN: ${{ secrets.FPL_PAT }}
        run: |
          # scheduled runs submit for real (the job's own guards do the
          # safety work); a dispatch is a dry run unless "apply" is ticked
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            python jobs/submit_transfers.py --apply
          else
            python jobs/submit_transfers.py
          fi
      - name: Commit state
        if: always()
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state/ site/
          git diff --staged --quiet || git commit -m "submit: auto transfer"
          git pull --rebase --autostash || true
          git push
      - name: Refresh dashboard
        # the squads and the automation panel changed — the dashboard bundle is
        # built by the plan job, so trigger it rather than showing stale data
        # until the next scheduled plan run
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh workflow run plan || true