name: live

# In-match tracker. Runs every 10 minutes during typical Premier League windows;
# the job exits immediately when nothing has kicked off.
on:
  schedule:
    - cron: "*/10 11-22 * * 6,0"     # Saturday and Sunday
    - cron: "*/10 18-22 * * 1,2,3,4,5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-state
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Track live scores
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/live_scores.py
      - name: Save state
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state: live scores"
          git pull --rebase --autostash || true
          git push
