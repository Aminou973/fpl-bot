name: plan

# The deadline plan for both teams. Runs a few times a day; the job itself
# decides whether the deadline is close enough to be worth a full solve.
on:
  schedule:
    - cron: "5 7,13,19 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the deadline is far away"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/deadline_plan.py ${{ inputs.force && '--force' || '' }}
      - name: Commit dashboard
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add site/ state/
          git diff --staged --quiet || git commit -m "plan: refresh dashboard"
          git pull --rebase --autostash || true
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
