name: plan

# The deadline plan for both teams.
#
# Fires hourly so one slot can always land 1-2 hours before the deadline, once
# the press conferences and late fitness news are in. Almost every run exits in
# seconds after a single API call; the full solve happens on the three refresh
# slots and on the one run that publishes the week's decision.
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if the deadline is far away"
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Build plan
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/deadline_plan.py ${{ inputs.force && '--force' || '' }}
      - name: Commit dashboard
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add site/ state/
          git diff --staged --quiet || git commit -m "plan: refresh dashboard"
          # a concurrent plan run may have just pushed fresher generated files;
          # rebasing this run's same-purpose artifacts onto those conflicts
          # every time - on conflict, take the remote's fresher artifacts
          git pull --rebase --autostash || {
            git rebase --abort
            git reset --hard origin/main
          }
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
