name: watch

# Price moves, injury news and the deadline countdown. Cheap, so it runs often.
on:
  schedule:
    - cron: "23 * * * *"        # every hour, off the hour to dodge GitHub's peak
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fpl-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Check prices and news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/watch.py
      - name: Save state
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state/
          git diff --staged --quiet || git commit -m "state: price and news snapshot"
          git pull --rebase --autostash || true
          git push
