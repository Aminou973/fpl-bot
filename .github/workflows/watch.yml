name: watch

# Price moves, injury news and the deadline countdown. Cheap, so it runs often.
on:
  schedule:
    - cron: "23 * * * *"        # every hour, off the hour to dodge GitHub's peak
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: fpl-state
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Check prices and news
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python jobs/watch.py
      - name: Save state
        run: |
          git config user.name  "fpl-bot"
          git config user.email "fpl-bot@users.noreply.github.com"
          git add state/ site/live.json
          git diff --staged --quiet || git commit -m "state: price and news snapshot"
          # a concurrent plan run may have just pushed fresher generated files;
          # on rebase conflict take the remote's - ours are same-purpose
          git pull --rebase --autostash || {
            git rebase --abort
            git reset --hard origin/main
          }
          git push
      # publish the fresh live.json so the dashboard's Live tab follows the
      # watcher hourly instead of only when the plan job happens to run
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deployment
        uses: actions/deploy-pages@v4
