# FPL bot configuration.
#
# entry_id is the number in your FPL URL:
#   https://fantasy.premierleague.com/entry/1234567/event/1  ->  entry_id: 1234567
# Fill both in and everything else follows automatically: the bot reads your real
# squad, bank and free transfers from the API each run.

horizon: 5                 # gameweeks the planner looks ahead
plan_window_hours: 40      # only run the deadline plan within this many hours of it
site_url: "https://aminou973.github.io/fpl-bot/"               # your GitHub Pages URL, shown at the bottom of each brief
chip_deadline: "2027-01-02T13:30:00Z"   # first chip set expires before GW19

# extra managers shown next to your teams everywhere live data appears:
# the friend-rivalry block. ids sit in your FPL URL after /entry/.
compare: [3644602]
live:
  enabled: true      # hourly live.json while a gameweek is in play

# engines: each validated on the 2025-26 replay before enabling.
# rank: ON - both arms beat the deterministic baseline on points AND
#       field percentile over GW1-6 (safe 332/78.0, diff 335/76.7 vs 331/74.6).
# scenarios: OFF - risk_lambda 0.6 changed decisions and cost points, 0.3
#       changed nothing; the useful range needs the P6 tuning sweep.
engines:
  rank:
    enabled: true
    alpha: 0.5
  chips:
    tier_a: true      # TC/BB decided in the ILP for the imminent week only
    branching: true   # WC/FH branch evaluation at calendar-flagged weeks
    branch_time_limit: 60
  price:
    enabled: true     # inert until state/price_log.jsonl has enough history
    gamma: 0.05       # objective points per £0.1m of avoided rise
    horizon_hours: 72
  scenarios:
    enabled: false
    n: 32
    risk_lambda: 0.6
    cvar_beta: 0.75
  news:
    enabled: true     # watch-job scans only; may lower doubtful players'
                      # availability, never raise it (pre-agreement rule)
tuning:
  auto_apply: false   # when true, deadline_plan overlays data/backtest/tuning.json
                      # best params UNDER per-team config (explicit config wins)
  results: data/backtest/tuning.json

teams:
  Minoux_69:
    entry_id: 4894622            # <- put your real entry id here
    role: main
    free_transfers: 1      # pinned 2026-08-27: the official app shows 1 FT
                           # (unused GW1 transfer did not bank this season)
    blurb: >-
      Main team - template safe. Haaland locked in and a tilt toward well-owned
      players, so a big popular haul never costs you rank.
    hit_threshold: 6       # only take a -4 if the plan gains more than this
    rank:                  # replaces ownership_bonus (xp-weighted, every week)
      alpha: 0.5
      tilt: 0.4            # template-safe: buys the field's players
      elite_weight: 0.3    # 30% of the tilt reads the top-50 template (fplbot.elite)
    lock:
      - ["Haaland", "MCI"]
    # squad is only a fallback for when the API cannot be read
