# FPL bot configuration.
#
# entry_id is the number in your FPL URL:
#   https://fantasy.premierleague.com/entry/1234567/event/1  ->  entry_id: 1234567
# Fill both in and everything else follows automatically: the bot reads your real
# squad, bank and free transfers from the API each run.

horizon: 5                 # gameweeks the planner looks ahead
plan_window_hours: 40      # only run the deadline plan within this many hours of it
site_url: "https://aminou973.github.io/fpl-bot/"               # your GitHub Pages URL, shown at the bottom of each brief
chip_deadline: "2027-01-02T13:30:00Z"   # first chip set expires before GW19

teams:
  Minoux_69:
    entry_id: 4894622            # <- put your real entry id here
    role: main
    free_transfers: 1      # pinned 2026-08-27: the official app shows 1 FT
                           # (unused GW1 transfer did not bank this season)
    blurb: >-
      Main team - template safe. Haaland locked in and a tilt toward well-owned
      players, so a big popular haul never costs you rank.
    hit_threshold: 6       # only take a -4 if the plan gains more than this
    ownership_bonus: 0.04  # points added per 1% ownership when picking
    lock:
      - ["Haaland", "MCI"]
    # squad is only a fallback for when the API cannot be read
    squad:
      - ["Kinsky", "TOT"]
      - ["Verbruggen", "BHA"]
      - ["Hume", "SUN"]
      - ["Shaw", "MUN"]
      - ["Gvardiol", "MCI"]
      - ["Davis", "IPS"]
      - ["Mosquera", "ARS"]
      - ["E.Le Fée", "SUN"]
      - ["Mbeumo", "MUN"]
      - ["B.Fernandes", "MUN"]
      - ["Szoboszlai", "LIV"]
      - ["Gomez", "BHA"]
      - ["Haaland", "MCI"]
      - ["Calvert-Lewin", "LEE"]
      - ["João Pedro", "CHE"]

  Minoux_41:
    entry_id: 4896428            # <- put your real entry id here
    role: risk
    free_transfers: 1      # pinned 2026-08-27: same as the other team
    blurb: >-
      Risk team - full differential. No Haaland, at least nine players under 8%
      ownership, optimised for ceiling rather than median.
    hit_threshold: 4       # the risk team is allowed to move faster
    objective: ceiling
    max_captain_ownership: 25   # never captain what the whole field owns
    ban:
      - ["Haaland", "MCI"]
    min_differentials:
      count: 9
      max_ownership: 8
    squad:
      - ["Raya", "ARS"]
      - ["Palmer", "IPS"]
      - ["Calafiori", "ARS"]
      - ["Davis", "IPS"]
      - ["Shaw", "MUN"]
      - ["Aina", "NFO"]
      - ["Hume", "SUN"]
      - ["Wirtz", "LIV"]
      - ["B.Fernandes", "MUN"]
      - ["Mbeumo", "MUN"]
      - ["Yates", "NFO"]
      - ["Tzolis", "ARS"]
      - ["Georginio", "BHA"]
      - ["João Pedro", "CHE"]
      - ["Haaland", "MCI"]
